<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Option 3: Zine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --paper: #fff4dc;
        --ink: #1d1a3a;
        --card: #ffffff;
        --pink: #ff4d8d;
        --blue: #4d6bff;
        --yellow: #ffd43b;
        --green: #16c784;
        /* Text that sits on one of the bright colors, in either mode. */
        --on: #1d1a3a;
        --mono: "Space Mono", ui-monospace, monospace;
        --pad: clamp(16px, 4vw, 56px);
      }
      [data-theme="dark"] {
        --paper: #15122b;
        --ink: #fff1d6;
        --card: #241f49;
        color-scheme: dark;
      }
      [data-type="art"] {
        --c: var(--pink);
      }
      [data-type="photo"] {
        --c: var(--blue);
      }
      [data-type="video"] {
        --c: var(--yellow);
      }
      [data-type="music"] {
        --c: var(--green);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--paper)
          radial-gradient(color-mix(in srgb, var(--ink) 14%, transparent) 1.2px, transparent 1.3px) 0 0 / 18px 18px;
        color: var(--ink);
        font: 16px/1.5 "Bricolage Grotesque", system-ui, sans-serif;
        overflow-x: clip;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        color: inherit;
        cursor: pointer;
      }
      img {
        display: block;
      }

      .btn,
      .filters button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 18px;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: var(--card);
        box-shadow: 4px 4px 0 var(--ink);
        font: 700 14px var(--mono);
        text-transform: uppercase;
        transition:
          transform 0.12s,
          box-shadow 0.12s;
      }
      .btn:hover,
      .filters button:hover {
        transform: translate(-2px, -2px);
        box-shadow: 6px 6px 0 var(--ink);
      }
      body[data-view="home"] .mast nav a[href="#"],
      body[data-view="about"] .mast nav a[href="#/about"],
      .filters button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      #theme {
        padding: 8px;
        background: var(--yellow);
        color: var(--on);
      }

      .mast {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 24px;
        align-items: end;
        padding: 40px var(--pad) 28px;
      }
      .name {
        font-weight: 800;
        font-size: clamp(56px, 12vw, 168px);
        line-height: 0.84;
        letter-spacing: -0.045em;
        text-transform: uppercase;
      }
      .name mark {
        color: inherit;
        background: linear-gradient(transparent 52%, var(--pink) 52% 88%, transparent 88%);
      }
      body:not([data-view="home"]) .name {
        font-size: clamp(36px, 5vw, 60px);
      }
      body:not([data-view="home"]) :is(.burst, .tape) {
        display: none;
      }
      .side {
        display: flex;
        gap: 28px;
        align-items: center;
      }
      .me img {
        width: clamp(72px, 9vw, 120px);
        height: auto;
        border: 3px solid var(--ink);
        border-radius: 50%;
        box-shadow: 6px 6px 0 var(--blue);
        transform: rotate(5deg);
      }
      .burst {
        position: relative;
        display: grid;
        place-items: center;
        width: 104px;
        height: 104px;
        background: var(--yellow);
        color: var(--on);
        font: 700 14px/1.1 var(--mono);
        text-align: center;
        text-transform: uppercase;
        transform: rotate(-10deg);
      }
      .burst::before,
      .burst::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        background: var(--yellow);
        transform: rotate(30deg);
      }
      .burst::after {
        transform: rotate(60deg);
      }
      .mast nav {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .tape {
        overflow: hidden;
        background: var(--pink);
        color: var(--on);
        border-block: 3px solid var(--ink);
        font: 700 15px/2.4 var(--mono);
        white-space: nowrap;
      }
      .tape div {
        display: inline-block;
        animation: slide 50s linear infinite;
      }
      @keyframes slide {
        to {
          transform: translateX(-50%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .tape div {
          animation: none;
        }
      }

      .filters {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        padding: 32px var(--pad) 0;
      }
      .filters span {
        opacity: 0.6;
      }
      .pile {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
        gap: 44px 34px;
        padding: 40px var(--pad) 96px;
      }
      .card {
        position: relative;
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 16px;
        box-shadow: 7px 7px 0 var(--c);
        transform: rotate(var(--r));
        transition:
          transform 0.15s,
          box-shadow 0.15s;
      }
      .card:hover,
      .card:focus-visible {
        transform: translate(-3px, -3px);
        box-shadow: 11px 11px 0 var(--c);
      }
      .card > img {
        width: 100%;
        height: auto;
        aspect-ratio: 1;
        object-fit: cover;
        border-bottom: 3px solid var(--ink);
        border-radius: 12px 12px 0 0;
      }
      .card h2 {
        font-weight: 800;
        font-size: 22px;
        line-height: 1.05;
        letter-spacing: -0.02em;
        padding: 12px 14px 4px;
      }
      .card p {
        font: 12px var(--mono);
        padding: 0 14px 14px;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 12px;
        background: var(--c);
        color: var(--on);
        border: 3px solid var(--ink);
        border-radius: 999px;
        font: 700 12px/1.6 var(--mono);
        text-transform: uppercase;
      }
      .card .tag {
        position: absolute;
        top: -14px;
        right: -12px;
        transform: rotate(6deg);
      }
      .badge {
        display: contents;
      }

      .spread {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 56px;
        align-items: start;
        padding: 24px var(--pad) 110px;
      }
      .pic {
        overflow: hidden;
        background: var(--card);
        border: 3px solid var(--ink);
        border-radius: 18px;
        box-shadow: 12px 12px 0 var(--c, var(--blue));
        transform: rotate(-1deg);
      }
      .pic img {
        width: 100%;
        height: auto;
      }
      .words h1 {
        font-weight: 800;
        font-size: clamp(44px, 6.5vw, 96px);
        line-height: 0.9;
        letter-spacing: -0.04em;
        text-transform: uppercase;
        margin: 16px 0 24px;
      }
      .facts {
        list-style: none;
        padding: 14px 18px;
        margin-bottom: 24px;
        background: var(--yellow);
        color: var(--on);
        border: 3px solid var(--ink);
        border-radius: 14px;
        font: 14px/1.7 var(--mono);
        transform: rotate(1deg);
      }
      .words p {
        font-size: 18px;
        margin-bottom: 14px;
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 28px;
      }
      footer {
        padding: 0 var(--pad) 90px;
        font: 12px var(--mono);
      }

      @media (max-width: 760px) {
        .spread {
          grid-template-columns: 1fr;
          gap: 32px;
        }
        .burst {
          display: none;
        }
        .pile {
          grid-template-columns: repeat(2, 1fr);
          gap: 32px 18px;
        }
      }
    </style>
  </head>
  <body>
    <header class="mast">
      <a class="name" href="#">Kai's<br /><mark>Portfolio</mark></a>
      <div class="side">
        <div class="burst" aria-hidden="true">48<br />things<br />inside</div>
        <a class="me" href="#/about"><img id="me" alt="About Kai" width="400" height="400" /></a>
      </div>
      <nav aria-label="Main">
        <a class="btn" href="#">Work</a>
        <a class="btn" href="#/about">About</a>
        <button class="btn" id="theme" type="button"></button>
      </nav>
    </header>
    <div class="tape" aria-hidden="true"><div></div></div>
    <main id="app"></main>
    <footer>© 2026 KAI BORCHARDT ✦ MADE BY HAND</footer>

    <script src="shared.js"></script>
    <script>
      const app = document.getElementById("app");
      const portrait = face("#ffd43b", "#1d1a3a");
      document.getElementById("me").src = portrait;
      document.querySelector(".tape div").textContent = "ART ✦ PHOTOS ✦ VIDEO ✦ MUSIC ✦ ".repeat(16);

      const TILTS = [-1.5, 1, -0.5, 1.8, 0.6, -1.2];
      const tag = (p) => `<span class="tag">${badge(p)}${LABEL[p.type]}</span>`;
      const card = (p, i) => `
        <a class="card" data-type="${p.type}" href="#/work/${p.id}" style="--r: ${TILTS[i % TILTS.length]}deg">
          <img src="${p.src}" alt="" width="${p.w}" height="${p.h}" loading="lazy">
          ${tag(p)}
          <h2>${p.title}</h2>
          <p>${p.medium} / ${p.date}</p>
        </a>`;

      function home() {
        app.innerHTML = `<nav class="filters" aria-label="Filter by type"></nav><div class="pile"></div>`;
        filters(app.querySelector(".filters"), (list) => {
          app.querySelector(".pile").innerHTML = list.map(card).join("");
        });
      }

      function piece(p) {
        const { prev, next } = near(p);
        app.innerHTML = `
          <article class="spread" data-type="${p.type}">
            <div class="pic"><img src="${p.src}" alt="${p.title}" width="${p.w}" height="${p.h}"></div>
            <div class="words">
              ${tag(p)}
              <h1>${p.title}</h1>
              <ul class="facts">
                <li><b>No.</b> ${p.n}</li>
                <li><b>Made with:</b> ${p.medium}</li>
                <li><b>When:</b> ${p.date}</li>
              </ul>
              <p>${BLURB}</p>
              <div class="row">
                ${prev ? `<a class="btn" href="#/work/${prev.id}">← Newer</a>` : ""}
                <a class="btn" href="#">Everything</a>
                ${next ? `<a class="btn" href="#/work/${next.id}">Older →</a>` : ""}
              </div>
            </div>
          </article>`;
      }

      function about() {
        app.innerHTML = `
          <article class="spread">
            <div class="pic"><img src="${portrait}" alt="Placeholder for a photo of Kai" width="400" height="400"></div>
            <div class="words">
              <span class="tag" data-type="music">The artist</span>
              <h1>Hi, I'm Kai!</h1>
              <p>${BIO.join("</p><p>")}</p>
              <div class="row">${CONTACT.map((c) => `<a class="btn" href="#/about">${c}</a>`).join("")}</div>
            </div>
          </article>`;
      }

      route({ home, piece, about });
    </script>
  </body>
</html>
