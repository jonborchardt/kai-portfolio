<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Option 5: Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Karla:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --oat: #f3e8d8;
        --card: #fffaf1;
        --ink: #3a2a20;
        --muted: #8a7565;
        --terra: #c9573c;
        --teal: #3f8483;
        --ochre: #e2a12f;
        --olive: #6f7d3c;
        --serif: Fraunces, Georgia, serif;
        --pad: clamp(16px, 5vw, 72px);
      }
      [data-theme="dark"] {
        --oat: #211914;
        --card: #2f241d;
        --ink: #f3e8d8;
        --muted: #b59f8d;
        --terra: #e3775a;
        --teal: #63aeac;
        --ochre: #edb450;
        --olive: #a3b266;
        color-scheme: dark;
      }
      [data-type="art"] {
        --c: var(--terra);
      }
      [data-type="photo"] {
        --c: var(--teal);
      }
      [data-type="video"] {
        --c: var(--ochre);
      }
      [data-type="music"] {
        --c: var(--olive);
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        background: var(--oat);
        color: var(--ink);
        font: 17px/1.6 Karla, system-ui, sans-serif;
        transition: background 0.3s;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      button {
        font: inherit;
        color: inherit;
        background: none;
        border: 0;
        cursor: pointer;
      }
      img {
        display: block;
      }

      .top {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: space-between;
        align-items: center;
        padding: 20px var(--pad);
      }
      .brand {
        display: flex;
        gap: 12px;
        align-items: center;
        font: 600 22px var(--serif);
      }
      .brand img {
        width: 44px;
        height: 44px;
        border-radius: 50%;
      }
      .top nav {
        display: flex;
        gap: 4px;
        align-items: center;
        padding: 6px;
        background: var(--card);
        border-radius: 999px;
      }
      .top nav a,
      .pill {
        padding: 7px 18px;
        border-radius: 999px;
        font-weight: 500;
      }
      .top nav a:hover,
      #theme:hover {
        background: var(--oat);
      }
      body[data-view="home"] .top nav a[href="#"],
      body[data-view="about"] .top nav a[href="#/about"] {
        background: var(--ink);
        color: var(--oat);
      }
      #theme {
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        color: var(--terra);
      }

      .hello {
        display: grid;
        grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr);
        gap: 40px;
        align-items: center;
        padding: 40px var(--pad) 56px;
      }
      h1 {
        font: 500 clamp(40px, 5.6vw, 80px) / 1.04 var(--serif);
        letter-spacing: -0.02em;
      }
      h1 em {
        color: var(--c);
      }
      .hello p {
        margin-top: 20px;
        color: var(--muted);
        font-size: 19px;
      }
      .collage {
        position: relative;
        height: 380px;
      }
      .collage::before {
        content: "";
        position: absolute;
        inset: 8% 14%;
        border-radius: 46% 54% 58% 42% / 52% 44% 56% 48%;
        background: var(--ochre);
        opacity: 0.55;
      }
      .collage img {
        position: absolute;
        height: auto;
        border-radius: 24px;
        box-shadow: 0 18px 36px -18px rgba(40, 20, 5, 0.6);
      }
      .collage img:nth-child(1) {
        left: 4%;
        top: 4%;
        width: 44%;
        transform: rotate(-6deg);
      }
      .collage img:nth-child(2) {
        right: 2%;
        top: 14%;
        width: 50%;
        transform: rotate(5deg);
      }
      .collage img:nth-child(3) {
        left: 34%;
        bottom: 0;
        width: 34%;
        border-radius: 50%;
        border: 7px solid var(--card);
      }

      .shelf {
        padding-bottom: 28px;
      }
      .shelf header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0 var(--pad) 8px;
      }
      .shelf h2 {
        display: flex;
        gap: 12px;
        align-items: center;
        font: 600 32px var(--serif);
      }
      .shelf h2::before,
      .chip::before {
        content: "";
        width: 0.5em;
        height: 0.5em;
        border-radius: 50%;
        background: var(--c);
      }
      .shelf h2 small {
        font: 500 15px Karla, sans-serif;
        color: var(--muted);
      }
      .more,
      .pill {
        border: 1.5px solid var(--ink);
      }
      .more {
        padding: 5px 16px;
        border-radius: 999px;
        font-weight: 500;
      }
      .more:hover,
      .pill:hover {
        background: var(--ink);
        color: var(--oat);
      }
      .cards {
        display: flex;
        gap: 22px;
        overflow-x: auto;
        padding: 10px var(--pad) 22px;
        scroll-snap-type: x proximity;
        scroll-padding-left: var(--pad);
        scrollbar-width: thin;
      }
      .open .cards {
        flex-wrap: wrap;
        overflow: visible;
      }
      .card {
        flex: none;
        display: flex;
        flex-direction: column;
        width: min-content;
        scroll-snap-align: start;
      }
      .pic {
        position: relative;
        display: block;
      }
      .pic img {
        width: auto;
        height: 240px;
        border-radius: 22px;
        transition: transform 0.25s;
      }
      .card:hover .pic img {
        transform: translateY(-5px) rotate(-1deg);
      }
      .card b {
        font: 600 18px/1.2 var(--serif);
        margin-top: 12px;
      }
      .card small {
        color: var(--muted);
        font-size: 14px;
      }
      /* Music sits on the shelf as records. */
      [data-type="music"] > .pic img {
        border-radius: 50%;
      }
      [data-type="music"] > .pic::after {
        content: "";
        position: absolute;
        inset: 0;
        margin: auto;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: var(--oat);
      }
      .badge {
        position: absolute;
        inset: 0;
        margin: auto;
        display: grid;
        place-items: center;
        width: 54px;
        height: 54px;
        border-radius: 50%;
        background: var(--card);
        color: var(--c);
      }
      .badge svg {
        width: 20px;
        height: 20px;
      }
      [data-type="music"] > .pic .badge {
        display: none;
      }

      .sheet {
        display: grid;
        grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
        gap: 44px;
        align-items: center;
        margin: 8px var(--pad) 48px;
        padding: 32px;
        background: var(--card);
        border-radius: 36px;
      }
      .sheet .art img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 72vh;
        margin: auto;
        border-radius: 22px;
      }
      .sheet .art img.round {
        border-radius: 50%;
        max-height: 420px;
      }
      .chip {
        display: inline-flex;
        gap: 8px;
        align-items: center;
        padding: 2px 14px;
        border: 1.5px solid var(--c);
        border-radius: 999px;
        font-weight: 500;
      }
      .note h1 {
        font-size: clamp(36px, 4.4vw, 60px);
        margin: 14px 0 8px;
      }
      .note .meta {
        color: var(--muted);
        margin-bottom: 18px;
      }
      .note p + p {
        margin-top: 12px;
      }
      .links {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }
      footer {
        padding: 16px var(--pad) 90px;
        color: var(--muted);
        font-size: 14px;
      }

      @media (max-width: 760px) {
        .hello,
        .sheet {
          grid-template-columns: 1fr;
        }
        .collage {
          height: 300px;
        }
        .sheet {
          padding: 18px;
          border-radius: 28px;
        }
        .pic img {
          height: 190px;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <a class="brand" href="#"><img id="me" alt="" width="400" height="400" />Kai's Portfolio</a>
      <nav aria-label="Main">
        <a href="#">Work</a>
        <a href="#/about">About</a>
        <button id="theme" type="button"></button>
      </nav>
    </header>
    <main id="app"></main>
    <footer>© 2026 Kai Borchardt. Thanks for looking.</footer>

    <script src="shared.js"></script>
    <script>
      const app = document.getElementById("app");
      const portrait = face("#e2a12f", "#3a2a20");
      document.getElementById("me").src = portrait;

      const card = (p) => `
        <a class="card" data-type="${p.type}" href="#/work/${p.id}">
          <span class="pic"><img src="${p.src}" alt="" width="${p.w}" height="${p.h}" loading="lazy">${badge(p)}</span>
          <b>${p.title}</b>
          <small>${p.medium} · ${p.date}</small>
        </a>`;
      const shelf = (type, title, list, more) => `
        <section class="shelf" data-type="${type}">
          <header>
            <h2>${title} <small>${list.length}</small></h2>
            ${more ? `<button class="more" type="button">See all</button>` : ""}
          </header>
          <div class="cards">${list.map(card).join("")}</div>
        </section>`;
      const ofType = (type) => PIECES.filter((p) => p.type === type);

      function home() {
        const [a, b] = [ofType("art")[0], ofType("photo")[0]];
        app.innerHTML = `
          <section class="hello">
            <div>
              <h1>Hi, I'm Kai. I make <em data-type="art">art</em>, <em data-type="photo">photos</em>, <em data-type="video">videos</em> and <em data-type="music">music</em>.</h1>
              <p>${PIECES.length} pieces so far. The newest is at the front of every shelf.</p>
            </div>
            <div class="collage" aria-hidden="true">
              <img src="${a.src}" alt="" width="${a.w}" height="${a.h}">
              <img src="${b.src}" alt="" width="${b.w}" height="${b.h}">
              <img src="${portrait}" alt="" width="400" height="400">
            </div>
          </section>
          ${TYPES.map((type) => shelf(type, PLURAL[type], ofType(type), true)).join("")}`;
      }

      // "See all" opens a shelf out into a full grid.
      app.onclick = (event) => {
        const button = event.target.closest(".more");
        if (!button) return;
        const open = button.closest(".shelf").classList.toggle("open");
        button.textContent = open ? "Show less" : "See all";
      };

      function piece(p) {
        app.innerHTML = `
          <article class="sheet" data-type="${p.type}">
            <div class="art"><img src="${p.src}" alt="${p.title}" width="${p.w * 2}" height="${p.h * 2}"></div>
            <div class="note">
              <span class="chip">${LABEL[p.type]}</span>
              <h1>${p.title}</h1>
              <p class="meta">${p.medium} · ${p.date}</p>
              <p>${BLURB}</p>
              <div class="links"><a class="pill" href="#">← All work</a></div>
            </div>
          </article>
          ${shelf(p.type, `More ${PLURAL[p.type].toLowerCase()}`, ofType(p.type).filter((q) => q !== p), false)}`;
      }

      function about() {
        app.innerHTML = `
          <article class="sheet">
            <div class="art"><img class="round" src="${portrait}" alt="Placeholder for a photo of Kai" width="400" height="400"></div>
            <div class="note">
              <h1>Hi, I'm Kai.</h1>
              <p>${BIO.join("</p><p>")}</p>
              <div class="links">${CONTACT.map((c) => `<a class="pill" href="#/about">${c}</a>`).join("")}</div>
            </div>
          </article>`;
      }

      route({ home, piece, about });
    </script>
  </body>
</html>
